<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{BRAND}} — {{TAGLINE}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            matu: {
              yellow: '#f4ed36',
              lilac: '#8584bd',
              mint: '#b5c995',
              coral: '#f8c1ba',
              bone: '#f9f5f2',
              ink: '#0d0d0d',
            },
          },
          boxShadow: {
            brutal: '3px 3px 0 #000',
            'brutal-lg': '4px 4px 0 #000',
          },
        },
      },
    };
  </script>
  <style>
    html, body, #root { margin: 0; min-height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f9f5f2;
      color: #0d0d0d;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState } = React;

    function App() {
      const [ok, setOk] = useState(false);

      return (
        <div className="min-h-screen bg-matu-bone text-matu-ink">
          <header className="sticky top-0 z-20 border-b-2 border-black bg-matu-bone/90 backdrop-blur">
            <div className="mx-auto flex max-w-5xl items-center justify-between gap-4 px-4 py-3">
              <div className="flex items-center gap-2 text-[1.05rem] font-black tracking-tight">
                <span className="inline-block h-3.5 w-3.5 rounded-[3px] border-2 border-black bg-matu-yellow shadow-brutal" />
                {{BRAND}}
              </div>
              <nav className="hidden gap-4 text-sm font-bold sm:flex">
                <a href="#features" className="hover:underline">{{NAV_1}}</a>
                <a href="#cta" className="hover:underline">{{NAV_2}}</a>
              </nav>
              <button
                type="button"
                onClick={() => setOk(true)}
                className="rounded-full border-2 border-black bg-matu-yellow px-3.5 py-1.5 text-xs font-extrabold shadow-brutal"
              >
                {{CTA_PRIMARY}}
              </button>
            </div>
          </header>

          <main>
            <section className="mx-auto grid max-w-5xl gap-8 px-4 py-12 md:grid-cols-2 md:items-end md:py-16">
              <div>
                <span className="mb-3 inline-block rounded-full border-2 border-black bg-matu-mint px-2.5 py-1 text-[10px] font-extrabold uppercase tracking-wider">
                  {{EYEBROW}}
                </span>
                <h1 className="mb-4 max-w-[12ch] text-4xl font-black leading-[0.95] tracking-tight sm:text-5xl md:text-6xl">
                  {{HEADLINE}}
                </h1>
                <p className="mb-6 max-w-[36ch] text-base opacity-80">
                  {{SUBHEAD}}
                </p>
                <div className="flex flex-wrap gap-3">
                  <button
                    type="button"
                    onClick={() => setOk(true)}
                    className="rounded-full border-2 border-black bg-matu-yellow px-5 py-2.5 text-sm font-extrabold shadow-brutal"
                  >
                    {{CTA_PRIMARY}}
                  </button>
                  <a
                    href="#features"
                    className="rounded-full border-2 border-black bg-white px-5 py-2.5 text-sm font-extrabold shadow-brutal"
                  >
                    {{CTA_SECONDARY}}
                  </a>
                </div>
                {ok ? (
                  <p className="mt-4 text-sm font-bold text-matu-lilac">Listo — interacción React OK.</p>
                ) : null}
              </div>
              <div className="min-h-[280px] rounded-2xl border-2 border-black bg-matu-lilac shadow-brutal-lg" />
            </section>

            <section id="features" className="border-t-2 border-black bg-white py-12">
              <div className="mx-auto grid max-w-5xl gap-4 px-4 sm:grid-cols-3">
                <article className="rounded-xl border-2 border-black bg-matu-bone p-4 shadow-brutal">
                  <h2 className="mb-2 text-base font-black">{{FEATURE_1_TITLE}}</h2>
                  <p className="text-sm opacity-75">{{FEATURE_1_BODY}}</p>
                </article>
                <article className="rounded-xl border-2 border-black bg-matu-bone p-4 shadow-brutal">
                  <h2 className="mb-2 text-base font-black">{{FEATURE_2_TITLE}}</h2>
                  <p className="text-sm opacity-75">{{FEATURE_2_BODY}}</p>
                </article>
                <article className="rounded-xl border-2 border-black bg-matu-bone p-4 shadow-brutal">
                  <h2 className="mb-2 text-base font-black">{{FEATURE_3_TITLE}}</h2>
                  <p className="text-sm opacity-75">{{FEATURE_3_BODY}}</p>
                </article>
              </div>
            </section>

            <section id="cta" className="border-t-2 border-black bg-matu-yellow py-10">
              <div className="mx-auto flex max-w-5xl flex-col items-start justify-between gap-4 px-4 sm:flex-row sm:items-center">
                <div>
                  <h2 className="text-2xl font-black tracking-tight">{{CTA_BAND_TITLE}}</h2>
                  <p className="text-sm font-medium opacity-80">{{CTA_BAND_BODY}}</p>
                </div>
                <button
                  type="button"
                  onClick={() => setOk(true)}
                  className="rounded-full border-2 border-black bg-black px-5 py-2.5 text-sm font-extrabold text-matu-yellow shadow-brutal"
                >
                  {{CTA_PRIMARY}}
                </button>
              </div>
            </section>
          </main>

          <footer className="border-t-2 border-black px-4 py-6 text-center text-xs font-bold opacity-60">
            © {{YEAR}} {{BRAND}} · Hecho con Matu
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
