# MatuAI — ai.matubyte.com
# Instalar:
#   sudo cp deploy/nginx-ai.matubyte.com.conf /etc/nginx/sites-available/ai.matubyte.com
#   sudo ln -sf /etc/nginx/sites-available/ai.matubyte.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# SSL:
#   sudo certbot --nginx -d ai.matubyte.com
#
# Requisitos DNS: A (o AAAA) de ai.matubyte.com → IP del VPS (NO CNAME a Firebase).

upstream matuai_app {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai.matubyte.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 10m;

    # Chat SSE — sin buffer, timeouts largos
    location /api/chat {
        proxy_pass http://matuai_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Meta webhooks — ack rápido; el proceso AI corre en background
    location /api/meta/webhook {
        proxy_pass http://matuai_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 5m;
    }

    location / {
        proxy_pass http://matuai_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
